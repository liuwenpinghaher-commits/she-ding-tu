<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设定图 · 一场一块</title>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = (q === "light" || q === "dark") ? q : localStorage.getItem("worldgraph-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <!-- HERO: 故事时列里叠放带在场标记的场面卡；连线只导航，不当 fold -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --night: #161310;
      --panel: #1f1b16;
      --panel-2: #2a241c;
      --cream: #ede4d4;
      --mute: #b4aa9e;
      --line: #3a342c;
      --brass: #c4a574;
      --brass-ink: #161310;
      --warn: #e0b56a;
      --warn-bg: #3a2f18;
      --glow: #2a2218;
      --line-hover: #5a5246;
      --stripe: #241f19;
      --col-on: rgba(196, 165, 116, 0.05);
      --handle-hover: rgba(196, 165, 116, 0.35);
      --grain-opacity: .07;
      --lib: 220px;
      --side: 400px;
      --cols: 4;
      --focus: 2px solid var(--brass);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --night: #f3eee4;
      --panel: #faf7f0;
      --panel-2: #efe8dc;
      --cream: #2c261e;
      --mute: #6f675c;
      --line: #d8cfc0;
      --brass: #8b6430;
      --brass-ink: #faf7f0;
      --warn: #9a6a10;
      --warn-bg: #f6e6c4;
      --glow: #e8dcc8;
      --line-hover: #b8aa94;
      --stripe: #e4d8c6;
      --col-on: rgba(139, 100, 48, 0.08);
      --handle-hover: rgba(139, 100, 48, 0.28);
      --grain-opacity: .04;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--night);
      color: var(--cream);
      font-family: "Noto Sans SC", sans-serif;
      font-size: 13.5px;
      line-height: 1.45;
    }
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 40;
      opacity: var(--grain-opacity);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    .skip { position: absolute; left: -999px; }
    .skip:focus { left: 8px; top: 8px; z-index: 50; background: var(--panel); color: var(--cream); padding: 6px 10px; }
    .app {
      display: grid;
      grid-template-columns: var(--lib) 1fr var(--side);
      grid-template-rows: auto 1fr;
      height: 100%;
      min-width: 1100px;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand {
      font-family: "EB Garamond", "Noto Serif SC", serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .brand em { font-style: italic; color: var(--brass); font-weight: 500; }
    .note { color: var(--mute); font-size: 11px; }
    .spacer { flex: 1; }
    button {
      font: inherit;
      background: transparent;
      color: var(--cream);
      border: 1px solid var(--line);
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 1px;
    }
    button:hover { border-color: var(--brass); color: var(--brass); }
    button:focus-visible, .card:focus-visible, .chip:focus-visible, .col-head:focus-visible, .lib-item:focus-visible, .lib-filter:focus-visible, .appear:focus-visible, .handle:focus-visible {
      outline: var(--focus); outline-offset: 2px;
    }
    button.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
    button.primary:hover { filter: brightness(1.05); color: var(--brass-ink); }
    html[data-theme="light"] button.primary:hover { filter: brightness(0.95); }
    button[aria-pressed="true"] { background: var(--cream); color: var(--night); border-color: var(--cream); }
    #themeBtn[aria-pressed="true"] {
      background: transparent;
      color: var(--cream);
      border-color: var(--brass);
    }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button:disabled:hover { border-color: var(--line); color: var(--cream); }
    .library, .side {
      background: var(--panel);
      overflow: auto;
      padding: 12px 12px 28px;
    }
    .library { border-right: 1px solid var(--line); }
    .side { border-left: 1px solid var(--line); }
    .library h2, .side h2 {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--mute);
      margin: 0 0 8px;
      font-weight: 500;
    }
    .library h3 {
      font-size: 11px;
      color: var(--mute);
      margin: 14px 0 6px;
      font-weight: 500;
    }
    .lib-row {
      display: flex;
      align-items: stretch;
      gap: 2px;
      margin-bottom: 2px;
    }
    .lib-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      text-align: left;
      border: 0;
      padding: 5px 4px;
      margin-bottom: 0;
      cursor: grab;
    }
    .lib-item[aria-current="page"] { background: var(--panel-2); }
    .lib-item .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .lib-filter {
      flex-shrink: 0;
      border: 0;
      padding: 4px 6px;
      font-size: 10px;
      color: var(--mute);
    }
    .lib-filter:hover { color: var(--brass); }
    .lib-filter[aria-pressed="true"] {
      background: var(--cream);
      color: var(--night);
    }
    .lib-meta { font-size: 11px; color: var(--mute); margin: 0 0 8px; line-height: 1.4; }
    .library input[type="search"] {
      width: 100%;
      font: inherit;
      color: var(--cream);
      background: var(--night);
      border: 1px solid var(--line);
      padding: 6px 8px;
      margin-bottom: 8px;
    }
    .library input[type="search"]:focus { border-color: var(--brass); outline: none; }
    .lib-item .off { margin-left: auto; font-size: 9px; color: var(--mute); }
    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background:
      radial-gradient(1200px 400px at 20% -10%, var(--glow) 0%, transparent 55%), var(--night); }
    .strip-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }
    .ruler {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      width: 100%;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex-shrink: 0;
    }
    .col-head {
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--cream);
      padding: 8px 16px 10px 8px;
      text-align: left;
      min-height: 88px;
      position: relative;
    }
    .col-head.on { box-shadow: inset 0 -2px 0 var(--brass); }
    .col-head .n {
      font-family: "EB Garamond", serif;
      font-size: 18px;
      color: var(--brass);
      display: block;
    }
    .col-head .clock {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--cream);
      display: block;
      margin-top: 2px;
    }
    .col-head .lab { font-size: 10px; color: var(--mute); }
    .col-head .dur { font-size: 10px; color: var(--brass); }
    .lens {
      height: 4px;
      margin-top: 6px;
      background: var(--line);
      position: relative;
      overflow: hidden;
    }
    .lens > span {
      display: block;
      height: 100%;
      background: var(--brass);
      opacity: .85;
    }
    .handle {
      position: absolute;
      top: 0; right: -5px;
      width: 10px; height: 100%;
      cursor: ew-resize;
      z-index: 3;
      background: transparent;
      border: 0;
      padding: 0;
    }
    .handle:hover, .handle:focus-visible { background: var(--handle-hover); }
    .handle::after {
      content: "";
      position: absolute;
      top: 10px; bottom: 10px; left: 3px;
      width: 2px;
      background: var(--brass);
    }
    .gap-menu {
      position: fixed;
      z-index: 60;
      width: 240px;
      background: var(--panel);
      border: 1px solid var(--brass);
      padding: 10px;
      display: none;
    }
    .gap-menu.open { display: block; }
    .gap-menu p { margin: 0 0 8px; font-size: 12px; }
    .gap-menu button { display: block; width: 100%; margin: 4px 0; text-align: left; }
    .card.is-spare {
      border-style: dashed;
      min-height: 72px;
      color: var(--mute);
      font-size: 12px;
    }
    .cov {
      display: flex;
      gap: 3px;
      margin-top: 6px;
    }
    .cov i {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--line);
      display: block;
    }
    .cov i.on { background: var(--brass); }
    .board-wrap { position: relative; flex: 1; overflow: visible; min-height: 0; }
    .cols {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      width: 100%;
      min-height: 100%;
      align-items: start;
    }
    .col {
      border-right: 1px solid var(--line);
      padding: 12px 10px 24px;
      min-height: 100%;
    }
    .col.on { background: var(--col-on); }
    .wires {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      padding: 9px 10px 8px;
      margin-bottom: 10px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      animation: rise .5s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: border-color 160ms cubic-bezier(0.16, 1, 0.3, 1), transform 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card:hover { border-color: var(--line-hover); }
    .card[aria-selected="true"] {
      border-color: var(--brass);
      box-shadow: 0 0 0 1px var(--brass);
    }
    .card.is-ellipsis { background: repeating-linear-gradient(-45deg, var(--panel-2), var(--panel-2) 6px, var(--stripe) 6px, var(--stripe) 7px); }
    .card.is-draft { border-style: dashed; }
    .card.is-off { opacity: .72; }
    .card.is-flash { margin-left: 10px; width: calc(100% - 10px); font-size: 12px; }
    .card.drop-on { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass); }
    .library.drop-on, .side.drop-on { outline: 1px dashed var(--brass); outline-offset: -4px; }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      color: var(--mute);
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .badge {
      border: 1px solid var(--line);
      padding: 0 5px;
      font-size: 9px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .badge.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
    .title {
      font-family: "Noto Serif SC", "EB Garamond", serif;
      font-size: 15px;
      font-weight: 600;
      margin: 4px 0 2px;
    }
    .cols.is-mid .title { font-size: 17px; }
    .cols.is-roomy .title { font-size: 20px; }
    .cols.is-roomy .card { padding: 14px 14px 12px; }
    .sum { font-size: 11px; color: var(--mute); }
    .val { font-size: 12px; color: var(--brass); margin: 4px 0 0; }
    .card-tr {
      font-size: 12px;
      color: var(--cream);
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      line-height: 1.45;
    }
    .card-tr b { color: var(--brass); font-weight: 600; margin-right: 4px; }
    .card-tr span { display: block; color: var(--mute); }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      background: var(--night);
      color: var(--cream);
      padding: 2px 6px 2px 4px;
      font-size: 11px;
      cursor: grab;
      border-radius: 99px;
    }
    .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
    .chip .role { font-size: 9px; color: var(--mute); letter-spacing: .04em; }
    .chip:hover, .chip[aria-pressed="true"] { border-color: var(--brass); }
    .kind-pick { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 12px; }
    .lib-actions { margin: 0 0 8px; }
    .cover-row select, .cover-row .add-sel {
      font: inherit; color: var(--cream); background: var(--night);
      border: 1px solid var(--line); padding: 4px 6px; max-width: 100%;
    }
    .col-count {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      color: var(--mute);
    }
    .col-count span { color: var(--cream); min-width: 9em; text-align: center; }
    .side h3 { font-size: 13px; margin: 14px 0 6px; font-family: "Noto Serif SC", serif; }
    .track-block {
      border: 1px solid var(--line);
      padding: 8px;
      margin-bottom: 8px;
      background: var(--night);
    }
    .track-block .who { font-weight: 700; margin-bottom: 4px; }
    .track-block p { margin: 3px 0 0; }
    .track-block b {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--brass);
      margin-right: 6px;
    }
    .debt {
      border-left: 2px solid var(--brass);
      padding: 6px 8px;
      margin: 6px 0;
    }
    .muted { color: var(--mute); font-size: 12px; }
    label { display: block; font-size: 12px; margin: 8px 0 4px; }
    textarea {
      width: 100%;
      font: inherit;
      color: var(--cream);
      background: var(--night);
      border: 1px solid var(--line);
      padding: 8px;
      min-height: 72px;
      resize: vertical;
    }
    textarea.short { min-height: 44px; }
    .field-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: 14px 0 6px;
    }
    .field-head h3, .field-head.tight { margin: 0; }
    .field-head.tight { margin: 8px 0 4px; font-size: 12px; }
    .discuss-btn { font-size: 11px; padding: 2px 8px; flex-shrink: 0; }
    .talk {
      border: 1px solid var(--line);
      background: var(--night);
      padding: 8px;
      min-height: 100px;
      max-height: 220px;
      overflow: auto;
      font-size: 12px;
      margin: 8px 0;
    }
    .talk .me { color: var(--brass); margin: 8px 0; }
    .talk .bot { color: var(--cream); margin: 8px 0; }
    .appear {
      display: block;
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--night);
      margin: 0 0 6px;
      padding: 8px;
    }
    .appear:hover { border-color: var(--brass); }
    .appear .k {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      color: var(--brass);
    }
    .win {
      border: 1px solid var(--line);
      padding: 8px;
      margin: 0 0 8px;
      background: var(--night);
    }
    .win p { margin: 4px 0 0; font-size: 12px; }
    .ro {
      border: 1px solid var(--line);
      background: var(--night);
      padding: 8px;
      font-size: 12px;
      color: var(--mute);
      margin: 0 0 8px;
    }
    .node-links { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .empty {
      display: none;
      grid-column: 1 / -1;
      padding: 56px 32px;
      max-width: 480px;
    }
    body.show-empty .library, body.show-empty .stage, body.show-empty .side { display: none; }
    body.show-empty .empty { display: block; }
    .empty h1 {
      font-family: "EB Garamond", "Noto Serif SC", serif;
      font-size: 32px;
      font-weight: 500;
      margin: 0 0 12px;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#board">跳到戏卡</a>
  <div class="app">
    <header>
      <div class="brand">设定图 <em>一场一块</em></div>
      <div class="note">− / + 改本页显示几列（少则宽、卡上更细）。‹ › 平移。拖右缘改故事时间。</div>
      <div class="spacer"></div>
      <div class="col-count" role="group" aria-label="本页显示几列">
        <button type="button" id="pagePrev" aria-label="窗口往左一列">‹</button>
        <button type="button" id="colMinus" aria-label="本页少显示一列">−</button>
        <span id="colCount">本页 4 / 6 列</span>
        <button type="button" id="colPlus" aria-label="本页多显示一列">+</button>
        <button type="button" id="pageNext" aria-label="窗口往右一列">›</button>
      </div>
      <button type="button" id="themeBtn" aria-pressed="false" aria-label="切到亮色主题">亮色</button>
      <span class="note" id="colHint"></span>
      <button type="button" id="emptyBtn">看空态</button>
      <button type="button" class="primary" id="nextBtn">写下一场</button>
    </header>
    <section class="empty" aria-label="空态">
      <h1>还没有一场戏。</h1>
      <p>可以先只写人物、地点、规则。没有场，设定仍然有用。左栏「新建」写入设定，不进 fold。</p>
      <p><button type="button" class="primary" id="emptyNew">去设定里新建</button>
         <button type="button" id="backBtn">回到有戏的演示</button></p>
    </section>
    <aside class="library" id="library">
      <h2 id="libTitle">设定 · 当前这几列</h2>
      <p class="lib-meta" id="libMeta"></p>
      <input type="search" id="libSearch" placeholder="搜全书人物、地点、规则…" autocomplete="off" aria-label="搜全书" />
      <div class="lib-actions"><button type="button" id="libNew">新建</button></div>
      <div id="libList"></div>
    </aside>
    <div class="stage">
      <div class="strip-scroll" id="stripScroll">
      <div class="ruler" id="ruler"></div>
      <div class="board-wrap" id="boardWrap">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <div class="cols" id="board"></div>
      </div>
      </div>
    </div>
    <aside class="side" id="side" aria-live="polite"></aside>
  </div>
  <div class="gap-menu" id="gapMenu" role="dialog" aria-label="空出的故事时间">
    <p id="gapText"></p>
    <button type="button" data-act="shift">后面的故事时间全部往前移</button>
    <button type="button" data-act="merge">融进下一列</button>
    <button type="button" data-act="empty">变成空场次（这段没戏）</button>
    <button type="button" data-act="cancel">取消</button>
  </div>
  <script>
    const COVER = ["地点", "人物", "道具", "组织", "伏笔"];
    const NODE_KINDS = ["人", "地", "物", "势力", "伏笔", "规矩"];
    const KIND_COLOR = { 人: "#c45c26", 地: "#6d6875", 物: "#e9c46a", 势力: "#bc6c25", 伏笔: "#e76f51", 规矩: "#a98467" };
    const MIN_DUR = 1;
    const PX_PER_MIN = 2;
    let viewCount = 4;
    let viewStart = 0;
    let columns = [
      { clock0: 9 * 60, clock1: 10 * 60, label: "第三日黄昏" },
      { clock0: 10 * 60, clock1: 18 * 60, label: "一夜" },
      { clock0: 18 * 60, clock1: 18 * 60 + 2, label: "次日申时" },
      { clock0: 18 * 60 + 2, clock1: 19 * 60, label: "同日酉时" },
      { clock0: 19 * 60, clock1: 21 * 60, label: "当夜" },
      { clock0: 21 * 60, clock1: 22 * 60, label: "尚空", spare: true }
    ];
    let drag = null;
    let pendingGap = null;
    const ENT = {
      阿禾: { kind: "人", color: "#c45c26", setup: "过路客。要把信带进城，又不敢自己带着进。" },

      else if (!state.createName) state.createName = (state.libQuery || "").trim();
      render();
    }
    function cannotDeleteReason(name) {
      const apps = appearancesOf(name);
      if (!apps.length) return "";
      const titles = apps.map((b) => `列${b.t}「${b.title}」`).join("、");
      return `还在这些场上：${titles}。先从分场条拿掉，再从设定里删。`;
    }
    function addNode(kind, name, setup) {
      const n = (name || "").trim();
      if (!NODE_KINDS.includes(kind)) return "类型不对。";
      if (!n) return "先写名字。";
      if (n.includes("|")) return "名字里不要用 |。";
      if (ENT[n]) return `设定里已有「${n}」。`;
      ENT[n] = { kind, color: KIND_COLOR[kind] || "#8a817c", setup: (setup || "").trim() };
      return "";
    }
    function deleteNode(name) {
      const err = cannotDeleteReason(name);
      if (err) { toast(err); return false; }
      if (!ENT[name]) return false;
      delete ENT[name];
      if (state.filter === name) state.filter = "all";
      if (state.chip && state.chip.name === name) state.chip = null;
      if (state.node === name) state.node = null;
      state.mode = "inspect";
      toast(`「${name}」已从设定里拿掉。`);
      render();
      return true;
    }

    function renderLibrary() {
      const q = (state.libQuery || "").trim();
      const inView = namesInView();
      const searching = q.length > 0;
      let listed = searching
        ? Object.keys(ENT).filter((n) => n.includes(q) || (ENT[n].setup && ENT[n].setup.includes(q)))
        : Object.keys(ENT).filter((n) => inView.has(n));
      if (state.filter !== "all" && ENT[state.filter] && !listed.includes(state.filter)) {
        listed = [state.filter, ...listed];
      }
      if (state.mode === "node" && state.node && ENT[state.node] && !listed.includes(state.node)) {
        listed = [state.node, ...listed];
      }
      const groups = { 人: [], 地: [], 物: [], 势力: [], 伏笔: [], 规矩: [] };
      listed.forEach((n) => { if (groups[ENT[n].kind]) groups[ENT[n].kind].push(n); });
      const title = $("libTitle");
      const meta = $("libMeta");
      if (title) title.textContent = searching ? "设定 · 搜全书" : "设定 · 当前这几列";
      if (meta) {
        meta.textContent = searching
          ? (listed.length ? `命中 ${listed.length} 条。点名字开档案；「场」只看有它的场。拖到卡上加入这场。` : "没有叫这个的。可以新建。")
          : `本页 ${listed.filter((n) => inView.has(n)).length} 项 · 设定 ${Object.keys(ENT).length} 项。点名字开档案。未出场的请搜或新建。`;
      }
      const body = Object.entries(groups).filter(([, names]) => names.length).map(([k, names]) => `
        <h3>${kindLabel(k)}</h3>
        ${names.map((n) => `
          <div class="lib-row">
            <button type="button" class="lib-item" draggable="${ENT[n].kind === "规矩" ? "false" : "true"}" data-entity="${esc(n)}" aria-current="${state.mode === "node" && state.node === n ? "page" : "false"}">
              <span class="dot" style="background:${ENT[n].color}"></span>${esc(n)}
              ${searching && !inView.has(n) ? `<span class="off">不在本页</span>` : ""}
            </button>
            ${ENT[n].kind === "规矩" ? "" : `<button type="button" class="lib-filter" data-filter="${esc(n)}" aria-pressed="${state.filter === n}" aria-label="只看有「${esc(n)}」的场">场</button>`}
          </div>`).join("")}
      `).join("");
      const empty = body ? "" : (searching ? "" : `<p class="lib-meta">这几列卡上还没有人物/地点。搜全书或点「新建」。</p>`);
      const miss = searching && !listed.length && q
        ? `<p><button type="button" id="libNewFromQ">用「${esc(q)}」新建</button></p>` : "";
      const clear = state.filter === "all" ? "" : `<p><button type="button" class="lib-item" data-filter="all">显示全部</button></p>`;
      $("libList").innerHTML = body + empty + miss + clear;
      $("libList").querySelectorAll("[data-entity]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (skipClick) return;
          openNode(btn.dataset.entity);
        });
      });
      $("libList").querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if (skipClick) return;
          applyFilter(btn.dataset.filter);
        });
      });
      const fromQ = $("libNewFromQ");
      if (fromQ) fromQ.addEventListener("click", () => openCreate(q));
    }

    function renderRuler() {
      const dense = maxDur();
      $("ruler").innerHTML = pageIndices().map((i) => {
        const c = columns[i];
        const t = i + 1;
        const d = c.clock1 - c.clock0;
        const dots = COVER.map((dim) => `<i class="${coverageAt(t, dim) ? "on" : ""}" title="${dim}"></i>`).join("");
        return `<div class="col-head ${state.col === t ? "on" : ""}" data-col="${t}" role="button" tabindex="0" aria-label="列 ${t} ${hm(c.clock0)} 到 ${hm(c.clock1)}">
          <span class="n">${t}</span>
          <span class="clock">${hm(c.clock0)}–${hm(c.clock1)}</span>
          <span class="dur">${durLabel(d)} · 等宽</span>
          <span class="lab">${c.label}${c.spare ? " · 空场次" : ""}</span>
          <div class="lens" title="条越满，这一列的故事时间越长"><span style="width:${Math.max(8, (d / dense) * 100)}%"></span></div>
          <span class="cov">${dots}</span>
          <button type="button" class="handle" data-edge="${i}" aria-label="拖 ${hm(c.clock1)} 改这一列结束的故事时间"></button>

      }).join("");
      $("ruler").querySelectorAll(".col-head").forEach((btn) => {
        const pick = () => {
          state.col = Number(btn.dataset.col);

          state.chip = null;

          if (hit) state.beatId = hit.id;
          render();
        };
        btn.addEventListener("click", (ev) => {
          if (ev.target.closest(".handle")) return;
          pick();
        });
        btn.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); }

        h.addEventListener("pointerdown", (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          const i = Number(h.dataset.edge);
          h.setPointerCapture(ev.pointerId);
          drag = { i, oldEnd: columns[i].clock1, startX: ev.clientX };
          hideGapMenu();

    function renderBoard() {
      const vis = visibleBeats();
      $("board").className = "cols" + (viewCount <= 2 ? " is-roomy" : viewCount <= 4 ? " is-mid" : "");
      $("board").innerHTML = pageIndices().map((i) => {
        const t = i + 1;
        const cards = vis.filter((b) => b.t === t).map((b, idx) => {
          const dim = state.filter !== "all" && !onCard(b, state.filter);
          const chips = deriveChips(b).map((c) => chipButton(b, c)).join("");
          return `<div class="card ${b.kind === "ellipsis" ? "is-ellipsis" : ""} ${b.status === "draft" ? "is-draft" : ""} ${b.offscreen ? "is-off" : ""} ${b.flashbackOf ? "is-flash" : ""} ${dim ? "dim" : ""}" data-id="${b.id}" style="animation-delay:${idx * 60}ms" tabindex="0" role="button" aria-selected="${b.id === state.beatId}">
            <div class="kicker"><span class="badge ${b.strict ? "warn" : ""}">${statusLabel(b)}</span></div>

            <div class="chips">${chips}</div>
          </div>`;
        }).join("");
        const filler = beats.some((b) => b.t === t) ? "" : `<div class="card is-spare">这段故事时间没有戏。空场次 ≠ 省略场。</div>`;
        return `<div class="col ${state.col === t ? "on" : ""}" data-t="${t}">${cards || filler}</div>`;
      }).join("");
      $("board").querySelectorAll(".card").forEach((el) => {
        const pick = () => {
          if (skipClick) return;
          const b = beats.find((x) => x.id === el.dataset.id);
          if (!b) return;
          state.beatId = b.id;
          state.col = b.t;
          state.mode = "inspect";
          state.chip = null;
          render();
        };
        el.addEventListener("click", (ev) => {
          if (ev.target.closest(".chip")) return;
          pick();
        });
        el.addEventListener("keydown", (ev) => {
          if (ev.target.closest(".chip")) return;
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); }
        });
      });
      $("board").querySelectorAll(".chip").forEach((el) => {
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          if (skipClick) return;
          const b = beats.find((x) => x.id === el.dataset.beat);
          state.beatId = b.id;
          state.col = b.t;
          state.chip = { beatId: b.id, name: el.dataset.name };
          state.mode = "chip";
          render();
        });
      });
      requestAnimationFrame(drawWires);
    }

    function drawWires() {
      const svg = $("wires");
      const wrap = $("stripScroll");
      const wr = wrap.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${wrap.scrollWidth} ${Math.max(wrap.scrollHeight, wrap.clientHeight)}`);
      svg.style.width = wrap.scrollWidth + "px";
      svg.style.height = Math.max(wrap.scrollHeight, wrap.clientHeight) + "px";
      const focus = state.chip ? state.chip.name : (ENT[state.filter] && ENT[state.filter].kind === "人" ? state.filter : null);
      if (!focus) {
        svg.innerHTML = "";
        return;
      }
      const nodes = [...$("board").querySelectorAll(`.chip[data-name="${focus}"]`)];
      const pts = nodes.map((n) => {
        const r = n.getBoundingClientRect();
        return { x: r.left - wr.left + wrap.scrollLeft + r.width / 2, y: r.top - wr.top + wrap.scrollTop + r.height / 2 };
      });
      const c = ENT[focus].color;
      const lines = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const mid = (a.x + b.x) / 2;
        lines.push(`<path d="M${a.x} ${a.y} C ${mid} ${a.y}, ${mid} ${b.y}, ${b.x} ${b.y}" fill="none" stroke="${c}" stroke-width="2" opacity="0.85"/>`);
      }
      svg.innerHTML = lines.join("");
    }

    function prevNext(name, beatId) {
      const seq = beats.filter((b) => onCard(b, name));
      const i = seq.findIndex((b) => b.id === beatId);
      return { prev: seq[i - 1], next: seq[i + 1], i, n: seq.length };
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }
    function fieldHead(label, spec, tag) {
      const h = tag === "span"
        ? `<span>${label}</span>`
        : `<h3>${label}</h3>`;
      return `<div class="field-head${tag === "span" ? " tight" : ""}">${h}<button type="button" class="discuss-btn" data-open-discuss="${esc(spec)}">讨论</button></div>`;
    }
    function discussIO(spec) {
      const p = spec.split("|");
      const kind = p[0];
      if (kind === "nextIntent") {
        return { label: "下一场 · 本场任务", get: () => nextIntent, set: (v) => { nextIntent = v; } };
      }
      if (kind === "nextBeat") {
        return {
          label: "下一场 · 整格草稿",
          get: () => nextIntent,
          set: (v) => { nextIntent = v; }
        };
      }
      if (kind === "setup") {
        const name = p[1];
        return {
          label: `档案 · ${name} · 基本设定`,
          get: () => (ENT[name] && ENT[name].setup) || "",
          set: (v) => { if (ENT[name]) ENT[name].setup = v; }
        };
      }
      const b = beats.find((x) => x.id === p[1]);
      if (!b) return { label: spec, get: () => "", set: () => {} };
      if (kind === "title") return { label: "这场 · 场次", get: () => b.title || "", set: (v) => { b.title = v; } };
      if (kind === "intent") return { label: "这场 · 本场任务", get: () => b.intent || "", set: (v) => { b.intent = v; } };
      if (kind === "value") return { label: "这场 · 价值转折", get: () => b.value_shift || "", set: (v) => { b.value_shift = v; } };
      if (kind === "track") {
        const who = p[2], f = p[3];
        const lab = { do: "动作", say: "对白", think: "内心" }[f] || f;
        const tr = (b.tracks || []).find((t) => t.who === who);
        return {
          label: `${who} · ${lab}`,
          get: () => (tr && tr[f]) || "",
          set: (v) => {
            if (!tr) return;
            tr[f] = v;
          }
        };
      }
      if (kind === "state" || kind === "delta") {
        const name = p[2];
        if (!b.stateAt) b.stateAt = {};
        if (!b.delta) b.delta = {};
        const bag = kind === "state" ? b.stateAt : b.delta;
        return {
          label: kind === "state" ? `这场 · ${name} · 当场情状` : `这场 · ${name} · 本场变化`,
          get: () => bag[name] || "",
          set: (v) => { bag[name] = v; }
        };
      }
      return { label: spec, get: () => "", set: () => {} };
    }
    function mockTalk(spec, user) {
      const io = discussIO(spec);
      const cur = io.get();
      const ask = (user || "").trim();
      if (spec === "nextBeat") {
        return ask
          ? `（演示稿）整场草稿：场次「河上必须选」。本场任务：${ask}。阿禾动作：停步。船娘对白：过河的规矩我懂。点「写入此框」只把这段确认稿写进本场任务；真产品会拆进场次 / 动作对白内心 / 本场变化。`
          : `要写下一场，先有本场任务。当前任务：${cur || "（空）"}。点写入才会进框，点「写入正史」才进 fold。`;
      }
      if (ask) return `（演示稿）「${io.label}」按你说的收成：${ask}。点「写入此框」才进对应输入框，不会直接进 fold。`;
      return `「${io.label}」现在是：${cur || "（空）"}。你说要改成什么样。点「写入此框」才进框。`;
    }
    function openDiscuss(spec) {
      state.discuss = { spec, log: [], proposal: "" };
      render();
    }
    function renderDiscuss() {
      const side = $("side");
      const d = state.discuss;
      const io = discussIO(d.spec);
      const logHtml = d.log.length
        ? d.log.map((m) => `<div class="${m.role}">${m.role === "me" ? "你" : "模型"}：${esc(m.text)}</div>`).join("")
        : `<p class="muted">还没有来回。先说一句，或直接让模型对着当前框里的字说。</p>`;
      side.innerHTML = `
        <h2>讨论</h2>
        <p class="muted">只讨论「${esc(io.label)}」。确认的句子才进这个输入框。进框仍是草稿；点「写入正史」才进 fold。不是铜炉主编，不走那套流水线。</p>
        <p class="muted">当前框里：${esc(io.get()) || "（空）"}</p>
        <div class="talk" id="talkLog">${logHtml}</div>
        <textarea id="talkIn" class="short" placeholder="你想问什么，或希望写成什么样。"></textarea>
        <p class="cover-row">
          <button type="button" id="talkAsk">让模型说</button>
          <button type="button" class="primary" id="talkWrite"${d.proposal ? "" : " disabled"}>写入此框</button>
          <button type="button" id="talkBack">返回（不写入）</button>
        </p>
        ${d.proposal ? `<p class="muted">待写入：${esc(d.proposal)}</p>` : `<p class="muted">演示不调模型。真产品会带上这段的 world 切片。</p>`}`;
      $("talkAsk").addEventListener("click", () => {
        const text = $("talkIn").value;
        const reply = mockTalk(d.spec, text);
        if (text.trim()) d.log.push({ role: "me", text: text.trim() });
        d.log.push({ role: "bot", text: reply });
        d.proposal = text.trim() || reply;
        $("talkIn").value = "";
        render();
      });
      $("talkWrite").addEventListener("click", () => {
        if (!d.proposal) return;
        io.set(d.proposal);
        const spec = d.spec;
        state.discuss = null;
        if (spec === "nextIntent" || spec === "nextBeat") state.mode = "next";
        if (spec.startsWith("setup|")) {
          state.node = spec.split("|")[1];
          state.mode = "node";
        }
        toast("已写入对应输入框。还没进 fold。");
        render();
      });
      $("talkBack").addEventListener("click", () => {
        state.discuss = null;
        render();
      });
    }

    function renderNodePage() {

      const winHtml = apps.length

          return `<div class="win">

      const debtHtml = isDebt
        ? (debtTrail().length
          ? debtTrail().map((row) => `
            <button type="button" class="appear" data-go-beat="${row.id}">

          : `<p class="muted">还没有场动这条伏笔。</p>`)
        : (debts.length

        : (knows.length
          ? `<p class="muted">本 demo 未接 knows 边。下面用已写的内心当切片，只读。真产品读 world 在此人上的知情。</p>` + knows.map((k) => `
            <button type="button" class="appear" data-go-beat="${k.id}">
              <span class="k">列 ${k.t} · ${esc(k.title)}${k.status === "draft" ? " · 草稿" : ""}</span>
              <p style="margin:4px 0 0">${esc(k.think)}</p>
            </button>`).join("")

        : `<p class="muted">${b.kind === "ellipsis" ? "省略场没有动作 / 对白 / 内心。" : "不在读者眼前，可以没有动作对白内心，仍可有本场变化。"}</p>`;

      const coverChips = deriveChips(b).map((c) => chipButton(b, c)).join("");
      side.innerHTML = `
        <h2>本场</h2>
        <p class="muted">在场从左栏拖进拖出。每个输入框旁「讨论」：确认后才写入该框，点「写入正史」才进 fold。</p>
        ${fieldHead("场次", "title|" + b.id)}
        <textarea id="beatTitle" class="short" rows="1">${esc(b.title || "")}</textarea>
        <p class="muted">列 ${b.t} · ${statusLabel(b)}</p>
        <h3>在场</h3>
        <div class="chips">${coverChips || `<span class="muted">还没有。从左栏拖进来。</span>`}</div>
        <p class="muted">点标记改这场的当场情状。地点不能拿空，把另一个地点拖进卡即替换。</p>
        ${fieldHead("本场任务", "intent|" + b.id)}
        <textarea id="beatIntent">${esc(b.intent || "")}</textarea>
        ${fieldHead("价值转折", "value|" + b.id)}
        <textarea id="beatValue" class="short" rows="1">${esc(b.value_shift || "")}</textarea>
        ${b.value_shift ? "" : `<p><span class="badge warn">空 · 标黄 · 不挡写入正史</span></p>`}
        <p class="muted">${esc(tensionLine(b))}</p>
        ${b.strict ? `<h3>检查</h3><p class="badge warn">${esc(b.strict)}</p>` : ""}
        ${b.flashbackOf ? `<p class="muted">闪回：人在后院想起渡口。渡口不因此出现在这张卡上。地点仍是后院。</p>` : ""}
        <h3>动作 / 对白 / 内心</h3>
        ${tracks}
        <h3>相关未收伏笔</h3>
        ${debts || `<p class="muted">这场没动伏笔。</p>`}
        ${b.status === "draft" ? `<p><button type="button" class="primary" id="commitBtn">写入正史</button></p><p class="muted" id="commitHint">人点了才进历史。</p>` : `<p class="muted">正史。改这场走 revise。本 demo 改字段只存在内存里，刷新即丢。</p>`}`;
      const titleEl = $("beatTitle");

    function render() {
      if (document.body.classList.contains("show-empty")) return;
      syncColCount();
      renderLibrary();
      renderRuler();
      renderBoard();
      renderSide();
    }

    function paintDragClock(i) {
      const c = columns[i];
      const head = document.querySelector(`.col-head[data-col="${i + 1}"]`);
      if (!head) return;
      const clock = head.querySelector(".clock");
      const dur = head.querySelector(".dur");
      if (clock) clock.textContent = `${hm(c.clock0)}–${hm(c.clock1)}`;
      if (dur) dur.textContent = `${durLabel(c.clock1 - c.clock0)} · 等宽透镜`;
    }

    window.addEventListener("pointermove", (ev) => {
      if (!drag) return;
      const mins = Math.round((ev.clientX - drag.startX) / PX_PER_MIN);
      const minEnd = columns[drag.i].clock0 + MIN_DUR;
      columns[drag.i].clock1 = Math.max(minEnd, drag.oldEnd + mins);
      paintDragClock(drag.i);
    });
    window.addEventListener("pointerup", (ev) => {
      if (!drag) return;
      const { i, oldEnd } = drag;
      const newEnd = columns[i].clock1;
      drag = null;
      if (newEnd > oldEnd) {
        shiftClocks(i + 1, newEnd - oldEnd);
        render();
        return;
      }
      if (newEnd < oldEnd) {
        pendingGap = { i, oldEnd, newEnd };
        const leftover = oldEnd - newEnd;
        showGapMenu(ev.clientX, ev.clientY, `空出 ${durLabel(leftover)}（${hm(newEnd)}–${hm(oldEnd)}）。列宽没变。`, Boolean(columns[i + 1]));
        return;
      }
      render();
    });
    $("gapMenu").querySelectorAll("[data-act]").forEach((btn) => {
      btn.addEventListener("click", () => applyGap(btn.dataset.act));
    });
    window.addEventListener("pointerdown", (ev) => {
      if (!pendingGap) return;
      if ($("gapMenu").contains(ev.target)) return;
      applyGap("cancel");
    }, true);

    function clearDropMarks() {
      document.querySelectorAll(".drop-on").forEach((el) => el.classList.remove("drop-on"));
    }
    document.addEventListener("dragstart", (ev) => {
      const lib = ev.target.closest && ev.target.closest(".lib-item[data-entity]");
      const chip = ev.target.closest && ev.target.closest(".chip[data-name]");
      if (lib && lib.dataset.entity && ENT[lib.dataset.entity] && ENT[lib.dataset.entity].kind !== "规矩") {
        skipClick = true;
        entityDrag = { name: lib.dataset.entity, from: "lib" };
        ev.dataTransfer.setData("text/plain", entityDrag.name);
        ev.dataTransfer.effectAllowed = "copy";
        return;
      }
      if (chip) {
        skipClick = true;
        entityDrag = { name: chip.dataset.name, from: "chip", beatId: chip.dataset.beat };
        ev.dataTransfer.setData("text/plain", entityDrag.name);
        ev.dataTransfer.effectAllowed = "move";
      }
    });
    document.addEventListener("dragend", () => {
      clearDropMarks();
      entityDrag = null;
      setTimeout(() => { skipClick = false; }, 0);
    });
    document.addEventListener("dragover", (ev) => {
      const card = ev.target.closest && ev.target.closest(".card[data-id]");
      const lib = ev.target.closest && ev.target.closest("#library");
      const side = ev.target.closest && ev.target.closest("#side");
      clearDropMarks();
      if (card) {
        ev.preventDefault();
        card.classList.add("drop-on");
        return;
      }
      if (lib && entityDrag && entityDrag.from === "chip") {
        ev.preventDefault();
        $("library").classList.add("drop-on");
        return;
      }
      if (side && entityDrag) {
        ev.preventDefault();
        $("side").classList.add("drop-on");
      }
    });
    document.addEventListener("drop", (ev) => {
      const name = (ev.dataTransfer && ev.dataTransfer.getData("text/plain")) || (entityDrag && entityDrag.name);
      if (!name || !ENT[name]) return;
      const card = ev.target.closest && ev.target.closest(".card[data-id]");
      const cardBeat = card ? beats.find((x) => x.id === card.dataset.id) : null;
      const onLib = ev.target.closest && ev.target.closest("#library");
      const onSide = ev.target.closest && ev.target.closest("#side");
      clearDropMarks();
      if (cardBeat) {
        ev.preventDefault();
        if (entityDrag && entityDrag.from === "chip" && entityDrag.beatId === cardBeat.id) return;
        if (onCard(cardBeat, name) && ENT[name].kind !== "地") {
          toast(`「${name}」已在这场。`);
          return;
        }
        if (!addToBeat(cardBeat, name)) {
          toast(ENT[name].kind === "规矩" ? "规则不当作出场，不能拖进卡。打开档案写基本设定。" : `没法把「${name}」写进这场。`);
          return;
        }
        state.beatId = cardBeat.id;
        state.col = cardBeat.t;
        state.mode = "inspect";
        state.chip = null;
        toast(ENT[name].kind === "地" ? `这场地点换成「${name}」。` : `「${name}」进了这场。`);
        render();
        return;
      }
      if (onLib && entityDrag && entityDrag.from === "chip") {
        ev.preventDefault();
        const b = beats.find((x) => x.id === entityDrag.beatId);
        const err = cannotRemoveReason(b, name);
        if (err) { toast(err); return; }
        removeFromBeat(b, name);
        state.mode = "inspect";
        state.chip = null;
        toast(`「${name}」从这场拿掉。`);
        render();
        return;
      }
      if (onSide && entityDrag) {
        ev.preventDefault();
        const b = beats.find((x) => x.id === state.beatId);
        if (!b) return;
        if (entityDrag.from === "chip" && entityDrag.beatId === b.id && ENT[name].kind !== "地") return;
        if (onCard(b, name) && ENT[name].kind !== "地") {
          toast(`「${name}」已在这场。`);
          return;
        }
        if (!addToBeat(b, name)) {
          toast(ENT[name].kind === "规矩" ? "规则不当作出场，不能拖进卡。打开档案写基本设定。" : `没法把「${name}」写进这场。`);
          return;
        }
        toast(ENT[name].kind === "地" ? `这场地点换成「${name}」。` : `「${name}」进了这场。`);
        render();
      }
    });

    const THEME_KEY = "worldgraph-theme";
    function currentTheme() {
      return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    }
    function syncThemeBtn() {
      const btn = $("themeBtn");
      if (!btn) return;
      const light = currentTheme() === "light";

      const t = theme === "light" ? "light" : "dark";

      syncThemeBtn();

    $("stripScroll").addEventListener("scroll", () => requestAnimationFrame(drawWires));

    const q = new URLSearchParams(location.search);
    if (q.get("empty") === "1") document.body.classList.add("show-empty");
    if (q.get("filter")) state.filter = q.get("filter");
    if (q.get("col")) state.col = Number(q.get("col"));
    if (q.get("beat")) state.beatId = q.get("beat");
    if (q.get("node")) state.node = q.get("node");
    if (q.get("chip")) {
      state.chip = { beatId: state.beatId, name: q.get("chip") };
      if (!q.get("mode")) state.mode = "chip";
    }
    if (q.get("mode")) state.mode = q.get("mode");
    else if (q.get("node") && ENT[q.get("node")] && !q.get("chip")) state.mode = "node";
    if (q.get("view")) viewCount = Number(q.get("view")) || viewCount;
    if (q.get("start")) viewStart = Number(q.get("start")) || 0;
    if (q.get("theme") === "light" || q.get("theme") === "dark") applyTheme(q.get("theme"));
    else syncThemeBtn();
    if (q.get("col") || q.get("beat")) revealCol(state.col);
    else clampView();
    render();
  </script>
</body>
</html>
